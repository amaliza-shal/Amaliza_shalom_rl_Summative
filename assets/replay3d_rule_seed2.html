<style>
  :root {
    --bg: #f3efe6; --panel: rgba(255,252,246,0.94); --ink: #23262d; --muted: #6b6e75;
    --line: #ddd6c6; --good: #2e9f5a; --warn: #d9a21b; --bad: #d0473b; --accent: #2a78d6;

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);

  #scene { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  #top { top: 12px; left: 12px; right: 12px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  #top h1 { font-size: 20px; margin: 0; }
  #top .sub { color: var(--muted); font-size: 13px; }
  #term { font-size: 18px; font-weight: 700; margin-left: auto; }
  #action { font-size: 17px; font-weight: 600; }
  #reward { font-weight: 700; }
  #school { top: 92px; right: 12px; width: 260px; }
  #school h2, #kids h2 { font-size: 14px; margin: 0 0 8px; }
  .bar { margin: 6px 0 10px; }
  .bar .lab { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .bar .track { height: 8px; background: #e7e2d6; border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 4px; transition: width .4s; }
  #kids { bottom: 70px; left: 12px; width: 330px; max-height: 52vh; overflow: auto; }
  .kid { display: grid; grid-template-columns: 14px 80px 1fr; gap: 6px; align-items: center; margin: 5px 0; font-size: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .mini div { height: 6px; background: #e7e2d6; border-radius: 3px; overflow: hidden; }
  .mini span { display: block; height: 100%; }
  #controls { bottom: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; color: var(--ink); }
  button:hover { background: #f6f3ec; }
  #events { color: var(--muted); flex: 1; min-width: 200px; }
  #slider { flex: 0 0 200px; }
  #endcard { top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; padding: 18px 28px; }
  #endcard b { font-size: 18px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 760px) { #school { display: none; } #kids { width: auto; right: 12px; } }
</style>

: true, "learning": 0.7842, "attendance": 0.4823, "confidence": 0.7187, "home_pressure": 0.7042, "finished_strong": true}], "last_action": "Mentor Shalom", "last_reward": 13.6241, "total_reward": 16.7617, "dropouts": 0, "teacher_quits": 1, "events": ["Family shock at Keilla's home"], "end_reason": "Term 18 reached", "observation": [0.7057, 0.6692, 0.7821, 0.5495, 0.6175, 0.4723, 0.7578, 0.7263, 0.698, 0.6009, 0.7802, 0.5651, 0.8543, 0.7674, 0.7358, 0.349, 0.572, 0.4818, 0.7521, 0.7327, 0.7842, 0.4823, 0.7187, 0.7042, 0.2358, 0.3333, 0.3117, 0.4264, 0.1949, 0.0, 0.3719, 1.0]}};
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const ep = window.EPISODE;
// Frame k = the state after k terms. Frame 0 = the start.
const frames = [];
ep.terms.forEach((t, i) => frames.push({ state: t.state_before, action: i === 0 ? null : ep.terms[i - 1].action,
  reward: i === 0 ? null : ep.terms[i - 1].reward, events: i === 0 ? [] : ep.terms[i - 1].events }));
const last = ep.terms[ep.terms.length - 1];
frames.push({ state: ep.final, action: last.action, reward: last.reward, events: last.events });

const COLORS = { good: 0x2e9f5a, warn: 0xd9a21b, bad: 0xd0473b, gone: 0x9a9a9a };
function status(c) {
  if (!c.enrolled) return "gone";
  const s = (c.learning + c.attendance + c.confidence) / 3;
  return s >= 0.6 ? "good" : s >= 0.45 ? "warn" : "bad";
}

// ---------- Scene ----------
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe4f3);
scene.fog = new THREE.Fog(0xcfe4f3, 40, 90);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 14, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.maxPolarAngle = Math.PI / 2.1;
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a70, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(12, 20, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 });
scene.add(sun);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), mat(0xa9cd8b));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(3, 14), mat(0xd9c9a3));
path.rotation.x = -Math.PI / 2; path.position.set(0, 0.01, 4); scene.add(path);

// School building
const school = new THREE.Group();
const wall = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 6), mat(0xc4785a)); wall.position.y = 2.5;
// Gable roof: a triangle profile extruded along the building's length.
const roofShape = new THREE.Shape([new THREE.Vector2(-3.6, 0), new THREE.Vector2(3.6, 0), new THREE.Vector2(0, 2.8)]);
const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: 15, bevelEnabled: false }), mat(0x8f4339));
roof.rotation.y = Math.PI / 2; roof.position.set(-7.5, 5, 0);
const sign = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.9, 0.12), mat(0xfff5e6)); sign.position.set(0, 4.35, 3.1);
const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3, 0.2), mat(0x6b4532)); door.position.set(0, 1.5, 3.05);
school.add(wall, roof, door, sign);
for (const x of [-5, -2.8, 2.8, 5]) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.15), mat(0xe8f2fb, { emissive: 0x334455, emissiveIntensity: 0.15 }));
  w.position.set(x, 3, 3.05); school.add(w);
}
school.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
school.position.z = -6; scene.add(school);

// Tech: a screen on a stand that lights up with the tech level
const screen = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 0.2), mat(0x222233, { emissive: 0x39d0e0, emissiveIntensity: 0 }));
screen.position.set(10.5, 2.6, -2.5);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.8, 10), mat(0x555555));
post.position.set(10.5, 0.9, -2.5);
scene.add(screen, post);

function label(text, size = 48, color = "#23262d") {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.font = `600 ${size}px Segoe UI, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,252,246,0.9)";
  const w = g.measureText(text).width + 40;
  g.beginPath(); g.roundRect(256 - w / 2, 24, w, 80, 24); g.fill();
  g.fillStyle = color; g.fillText(text, 256, 66);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sp.scale.set(3.2, 0.8, 1);
  return sp;
}
const signText = label("SCHOOL", 54, "#8f4339"); signText.position.set(0, 4.35, -2.7); signText.scale.set(3.6, 0.9, 1);
scene.add(signText);
const techText = label("Tech", 44); techText.position.set(10.5, 3.9, -2.5); techText.scale.set(2, 0.5, 1);
scene.add(techText);

function person(color, scale = 1, cap = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45 * scale, 0.9 * scale, 4, 12), mat(color));
  body.position.y = 0.9 * scale;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38 * scale, 20, 16), mat(0xf0c9a5));
  head.position.y = 2.05 * scale;
  g.add(body, head);
  if (cap) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.15, 16), mat(0x23262d)); c.position.y = 2.42; g.add(c); }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.body = body;
  return g;
}

// Teachers: up to 6, standing by the school
const teachers = [];
for (let i = 0; i < 6; i++) {
  const t = person(0x2a78d6, 1, true);
  t.position.set(-6.25 + i * 2.5, 0, -1.6);
  scene.add(t); teachers.push(t);
}

// Children in an arc facing the school, with a learning ring and a star
const kids = [];
ep.final.children.forEach((c, i) => {
  const a = Math.PI * (0.18 + 0.64 * (i / 5));
  const home = new THREE.Vector3(Math.cos(a) * -9, 0, 3 + Math.sin(a) * 5);
  const p = person(COLORS.good, 0.85);
  p.position.copy(home);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.08, 8, 48, Math.PI * 2), mat(0x2a78d6));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; p.add(ring);
  const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.35), mat(0xf6c21c, { emissive: 0xf6c21c, emissiveIntensity: 0.4 }));
  star.position.y = 3.9; star.visible = false; p.add(star);
  const name = label(c.name); name.position.y = 3.1; p.add(name);
  scene.add(p);
  kids.push({ group: p, home, ring, star, away: 0 });
});

// ---------- HUD ----------
const BARS = [["budget", "Budget", "#3f9a6e"], ["gov_funding", "Gov funding", "#2a78d6"],
  ["community_trust", "Community trust", "#a36ec0"], ["tech_level", "Tech level", "#1f9fae"],
  ["teacher_quality", "Teacher quality", "#d98a2f"], ["teacher_morale", "Teacher morale", "#c75a74"]];
document.getElementById("bars").innerHTML = BARS.map(([k, l, c]) =>
  `<div class="bar"><div class="lab"><span>${l}</span><span id="v_${k}"></span></div>
   <div class="track"><div class="fill" id="b_${k}" style="background:${c}"></div></div></div>`).join("");
document.getElementById("who").textContent = `${ep.agent} director · seed ${ep.seed} · ${ep.scenario} world`;

let current = 0;
function show(k) {
  current = Math.max(0, Math.min(frames.length - 1, k));
  const f = frames[current], s = f.state;
  document.getElementById("term").textContent = `Term ${s.term} / 18`;
  document.getElementById("action").textContent = f.action || "Start of the 6 years";
  const r = document.getElementById("reward");
  r.textContent = f.reward === null ? `total ${s.total_reward.toFixed(2)}` :
    `${f.reward >= 0 ? "+" : ""}${f.reward.toFixed(2)}  /  ${s.total_reward.toFixed(2)}`;
  r.style.color = (f.reward ?? 0) >= 0 ? "var(--good)" : "var(--bad)";
  document.getElementById("events").textContent = f.events.length ? f.events.join("  ·  ") : "No surprises this term";
  for (const [k] of BARS) {
    const v = s.school[k];
    document.getElementById("b_" + k).style.width = (v * 100).toFixed(0) + "%";
    document.getElementById("v_" + k).textContent = v.toFixed(2);
  }
  teachers.forEach((t, i) => t.visible = i < s.school.teachers);
  screen.material.emissiveIntensity = s.school.tech_level * 2.2;
  document.getElementById("kidlist").innerHTML = s.children.map(c => {
    const col = { good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)", gone: "#999" }[status(c)];
    const bars = [["learning", "#2a78d6"], ["attendance", "#2e9f5a"], ["confidence", "#a36ec0"], ["home_pressure", "#d0473b"]]
      .map(([k, cc]) => `<div><span style="width:${(c[k] * 100).toFixed(0)}%;background:${cc}"></span></div>`).join("");
    return `<div class="kid"><div class="dot" style="background:${col}"></div>
      <div>${c.name}${c.finished_strong ? " ★" : ""}${c.enrolled ? "" : " (left)"}</div><div class="mini">${bars}</div></div>`;
  }).join("");
  s.children.forEach((c, i) => {
    const kd = kids[i];
    kd.group.userData.body.material.color.setHex(COLORS[status(c)]);
    kd.ring.scale.setScalar(0.4 + c.learning);
    kd.star.visible = c.finished_strong;
    kd.target = c.enrolled ? 0 : 1;
  });
  document.getElementById("slider").value = current;
  const end = document.getElementById("endcard");
  if (current === frames.length - 1 && s.end_reason) {
    const strong = s.children.filter(c => c.finished_strong).length;
    end.innerHTML = `<b>${s.end_reason}</b><br>${strong} of 6 children finished strong · dropouts ${s.dropouts} · total reward ${s.total_reward.toFixed(2)}`;
    end.style.display = "block";
  } else end.style.display = "none";
}

// ---------- Controls ----------
let playing = false, timer = null;
const btn = document.getElementById("play");
function setPlaying(p) {
  playing = p; btn.innerHTML = p ? "&#10074;&#10074; Pause" : "&#9654; Play";
  clearInterval(timer);
  if (p) timer = setInterval(() => { if (current >= frames.length - 1) setPlaying(false); else show(current + 1); }, 1800);
}
btn.onclick = () => { if (current >= frames.length - 1) show(0); setPlaying(!playing); };
document.getElementById("prev").onclick = () => { setPlaying(false); show(current - 1); };
document.getElementById("next").onclick = () => { setPlaying(false); show(current + 1); };
const slider = document.getElementById("slider");
slider.max = frames.length - 1;
slider.oninput = e => { setPlaying(false); show(+e.target.value); };
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Animation: idle bob, dropouts walk away along the path ----------
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  kids.forEach((kd, i) => {
    kd.away += ((kd.target || 0) - kd.away) * 0.03;
    const awayPos = new THREE.Vector3(kd.home.x * 2.6, 0, 22);
    kd.group.position.lerpVectors(kd.home, awayPos, kd.away);
    kd.group.position.y = kd.away > 0.02 ? Math.abs(Math.sin(t * 8)) * 0.15 : Math.sin(t * 2 + i) * 0.05;
    kd.group.lookAt(kd.away > 0.02 ? awayPos : new THREE.Vector3(0, 0, -6));
    kd.star.rotation.y = t * 2;
  });
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
show(0);
tick();
setPlaying(true);
</script>
</body>
</html>

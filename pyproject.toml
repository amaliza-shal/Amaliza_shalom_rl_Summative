[project]
name = "rl-summative"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio>=2.38.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pygame>=2.6.1",
    "pytest>=9.2.0",
    "tabulate>=0.10.0",
    "tensordict>=0.15.6",
    "torch>=2.15.0",
    "torchrl>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
